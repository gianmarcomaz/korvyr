# Local Korvyr stack: scanner API, Redis verdict cache, and npm registry proxy.
#
# The GNN checkpoint is not shipped. ./models is mounted read-only; if it does
# not contain the checkpoint named by KORVYR_MODEL_PATH the scanner starts in
# static-only mode and says so on /health.
name: korvyr

services:
  korvyr-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    image: korvyr-scanner:local
    container_name: korvyr-scanner
    ports:
      - "8000:8000"
    environment:
      # CUDA inference would additionally require the nvidia container runtime;
      # this stack is CPU-only.
      KORVYR_API_PORT: "8000"
      KORVYR_MODEL_PATH: /app/models/gnn_v2_cuda.pt
      KORVYR_MAX_WORKERS: "4"
      KORVYR_REQUIRE_GNN: "false"
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - korvyr

  korvyr-redis:
    image: redis:7-alpine
    container_name: korvyr-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - korvyr

  korvyr-proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: korvyr-proxy:local
    container_name: korvyr-proxy
    ports:
      - "4873:4873"
    environment:
      # Route traffic to the scanner container via Docker's internal DNS.
      KORVYR_PROXY_PORT: "4873"
      KORVYR_SCAN_API_URL: http://korvyr-scanner:8000
      KORVYR_REGISTRY_URL: https://registry.npmjs.org
      KORVYR_REDIS_URL: redis://korvyr-redis:6379
      KORVYR_CACHE_TTL: "86400"
    depends_on:
      korvyr-scanner:
        condition: service_healthy
      korvyr-redis:
        condition: service_healthy
    networks:
      - korvyr

networks:
  korvyr:
    name: korvyr
