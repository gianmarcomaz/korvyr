[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "korvyr"
version = "0.1.0"
description = "Hybrid GNN and static-analysis prototype for pre-install npm package screening."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Gianmarco Mazzella" }]
keywords = [
    "software-supply-chain",
    "npm-security",
    "malware-detection",
    "graph-neural-networks",
    "static-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/gianmarcomaz/Korvyr"
Repository = "https://github.com/gianmarcomaz/Korvyr"
Issues = "https://github.com/gianmarcomaz/Korvyr/issues"
Changelog = "https://github.com/gianmarcomaz/Korvyr/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Everything the scanner service needs to build graphs and run inference.
server = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "torch>=2.0",
    "torch-geometric>=2.3",
    "tree-sitter>=0.20",
    "tree-sitter-javascript>=0.25",
    "python-multipart>=0.0.6",
]
# Test dependencies, on top of [server].
test = [
    "korvyr[server]",
    "pytest>=8.0",
]
# Linting and formatting.
dev = [
    "korvyr[test]",
    "ruff>=0.6",
]
# Dataset building, training, evaluation, and diagnostics tooling.
research = [
    "korvyr[server]",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.66",
]

[project.scripts]
korvyr = "korvyr.cli.main:cli"

[tool.setuptools.packages.find]
include = ["korvyr", "korvyr.*"]

[tool.setuptools.package-data]
"korvyr.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["dashboard", "data", "models", "results", "checkpoints"]

[tool.ruff.lint]
# Correctness and import hygiene across the whole tree. The research scripts
# keep their verbose local naming, so style-only rules stay off by default.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Research scripts insert the repo root on sys.path before importing korvyr.
"scripts/*" = ["E402"]
